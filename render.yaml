services:
  - type: web
    name: packs
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_DEBUG
        value: "0"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_SECONDS
        value: "30.0"
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_CLIENT_API_KEY
        sync: false
      - key: FIREBASE_CLIENT_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_CLIENT_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_APP_ID
        sync: false
